name: scope
description: >-
  Which of a workflow's jobs a change needs, and for Go jobs which packages:
  the changed packages and their reverse dependencies. A pull request is
  measured from the base it merges into, a push from the last green run on its
  branch. Anything the scope cannot decide runs everything.
inputs:
  jobs:
    description: >-
      JSON object of job ID to its inputs: an array of path globs, or
      {"paths": [globs], "go": [package patterns], "go-binaries": [main
      packages]}. go-binaries selects a job that tests built binaries only when
      a file their build reads changed. A "!" glob excludes: a
      file selects the job when it matches a glob and no "!" glob. Go patterns
      are relative to go-directory: ./..., ./dir/..., ./dir or ".".
    required: true
  shared:
    description: "Path globs, one per line, of inputs every job shares (workflows, CI scripts, the toolchain); a change to one runs every job. A \"!\" glob excludes."
    default: ""
  full:
    description: "true runs every job and package, as a schedule, a workflow_dispatch or a pull request with full-label does."
    default: "false"
  full-label:
    description: "Pull request label that requests a full run."
    default: full-ci
  workflow:
    description: "Workflow file whose green runs on a branch are a push's base. Empty is the running workflow; a called workflow names its own file."
    default: ""
  jobs-workflow:
    description: "Workflow file that defines the job IDs in jobs. Empty is workflow; a reusable workflow whose caller's runs are the history (workflow empty) names its own file here."
    default: ""
  lookback:
    description: "How many of the newest successful runs on the branch to consult for a push's base, from 1 through 100."
    default: "20"
  path:
    description: "The checkout's directory under the workspace, as actions/checkout's path: git runs there, and the workflow files, every glob and go-directory are relative to it."
    default: "."
  go-directory:
    description: "Directory holding go.work or go.mod, relative to path, for jobs that name Go packages."
    default: "."
  go-tags:
    description: 'Build tag sets for loading the package graph, one per line ("unit,integration"; "-" is the empty set), so files behind them count. Each is loaded for every go-builds line and the graphs unioned.'
    default: ""
  go-builds:
    description: >-
      Platforms to load the package graph for, one per line as KEY=VALUE pairs
      (GOOS, GOARCH, GOARM, GOAMD64, GOARM64, CGO_ENABLED, GOEXPERIMENT,
      tags=a,b added to every tag set), such as "GOOS=darwin GOARCH=arm64".
      Empty is the runner's own platform.
    default: ""
  go-ignore:
    description: "Path globs, one per line, of changed files that affect no Go package (documentation). Any other file no package owns affects every package."
    default: ""
  go-owners:
    description: >-
      JSON object of path glob to the Go package directories (relative to
      go-directory, "." or "./a") whose code reads matching files at run time,
      such as a test reading ../../docs/*.md; a change to one affects those
      packages as well as the one holding it.
    default: ""
  token:
    description: "Token that can read Actions runs (actions: read) and the repository (contents: read)."
    default: ${{ github.token }}
outputs:
  full:
    description: "true when every job and every Go package is in scope."
  jobs:
    description: "JSON array of the job IDs that run, in jobs order."
  wide-jobs:
    description: "JSON array of the selected jobs that check every package, not only the affected ones: a full run, a shared change, or one of the job's own paths changed."
  selections:
    description: 'JSON object of each selected job ID to what it checks: the affected Go packages its patterns match, as import paths, or "all". Pass it to acceptance verify with parent-selections, so a push reuses a job only when the pull request checked at least as much.'
  parent-selections:
    description: "A push of a merge commit: selections measured from the merge's first parent, as the pull request's run measured them over the same tree. Pass it to acceptance verify. Empty for other events, a single-parent push, or when that measurement failed."
  parent-files:
    description: "A push of a merge commit: path of a file listing the paths changed since the merge's first parent, one per line, for a caller that derives its own selections from files. Empty when parent-selections is."
  base:
    description: "The commit the change is measured from; empty for a full run."
  files:
    description: "Path of a file listing the changed paths, one per line; empty for a full run."
  reason:
    description: "Why the scope is what it is."
  go-packages:
    description: 'JSON object of module directory (relative to go-directory) to the package directories to check, relative to the module ("." or "./a"); "./..." for every package. Modules with nothing affected are absent.'
  go-args:
    description: "The affected Go packages as go command arguments from go-directory, space-separated: import paths, or each module's path/... when every package is in scope. In workspace mode one go test over them spans modules, in package list mode, so results cache."
  go-reason:
    description: "Why the Go packages are what they are."
runs:
  using: node24
  main: index.cjs
