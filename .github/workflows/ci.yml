name: Action contract
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  GOCACHE: ${{ github.workspace }}/.contract-build
  GOMODCACHE: ${{ github.workspace }}/.contract-modules
jobs:
  smoke:
    if: github.actor == 'ashtonian' && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'ashtonian')
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(vars.MACOS_CI == 'on' && '["arc-go-ci-actions","macos-latest"]' || '["arc-go-ci-actions"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: npm test
      - uses: ./
        with:
          go-version-file: fixtures/go.work
          workload: ${{ toJSON(matrix) }}
          cache-key-prefix: smoke-v1
      - run: go test -race ./...
        working-directory: fixtures
      - name: Validate workflow syntax
        if: runner.os == 'Linux'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  seed:
    if: github.actor == 'ashtonian' && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'ashtonian')
    runs-on: arc-go-ci-actions
    timeout-minutes: 15
    outputs:
      key: ${{ steps.go.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: go
        with:
          go-version: "1.26.9"
          build-cache-backend: github
          cache-key-prefix: probe-${{ github.run_id }}-${{ github.run_attempt }}
      - run: |
          mkdir -p "$GOCACHE" "$GOMODCACHE"
          echo keep > "$GOCACHE/contract-sentinel"
          echo old > "$GOCACHE/contract-stale"
          touch -t 202001010000 "$GOCACHE/contract-stale"
          go test ./...
        working-directory: fixtures
  restore:
    needs: seed
    runs-on: arc-go-ci-actions
    timeout-minutes: 15
    outputs:
      key: ${{ steps.go.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: go
        with:
          go-version: "1.26.9"
          build-cache-backend: github
          cache-key-prefix: probe-${{ github.run_id }}-${{ github.run_attempt }}
          cache-mode: read-only
      - env:
          MATCHED: ${{ steps.go.outputs.cache-matched-key }}
          EXPECTED: ${{ needs.seed.outputs.key }}
        run: |
          test "$MATCHED" = "$EXPECTED"
          test -f "$GOCACHE/contract-sentinel"
          test ! -e "$GOCACHE/contract-stale"
          echo reader > "$GOCACHE/reader-only"
  disabled:
    needs: seed
    runs-on: arc-go-ci-actions
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: go
        with:
          go-version: "1.26.9"
          build-cache-backend: github
          cache-key-prefix: probe-${{ github.run_id }}-${{ github.run_attempt }}
          cache-mode: off
      - env:
          MATCHED: ${{ steps.go.outputs.cache-matched-key }}
        run: |
          test -z "$MATCHED"
          test ! -e "$GOCACHE/contract-sentinel"
  warm:
    needs: [seed, restore]
    runs-on: arc-go-ci-actions
    timeout-minutes: 15
    outputs:
      key: ${{ steps.go.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: go
        with:
          go-version: "1.26.9"
          build-cache-backend: github
          cache-key-prefix: probe-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Assert read-write restore outputs
        env:
          MATCHED: ${{ steps.go.outputs.cache-matched-key }}
          EXPECTED: ${{ needs.seed.outputs.key }}
        run: |
          test "$MATCHED" = "$EXPECTED"
          test -f "$GOCACHE/contract-sentinel"
          test ! -e "$GOCACHE/contract-stale"
  # A runner that provides a remote build cache: GOCACHEPROG_REMOTE_URL and
  # gocacheprog on PATH. The stub plugin is never started.
  remote:
    if: github.actor == 'ashtonian' && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'ashtonian')
    runs-on: arc-go-ci-actions
    timeout-minutes: 15
    outputs:
      key: ${{ steps.go.outputs.cache-primary-key }}
    env:
      GOCACHEPROG_REMOTE_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install a stub plugin
        run: |
          mkdir -p "$RUNNER_TEMP/plugin-bin"
          printf '#!/bin/sh\nexit 1\n' > "$RUNNER_TEMP/plugin-bin/gocacheprog"
          chmod +x "$RUNNER_TEMP/plugin-bin/gocacheprog"
          echo "$RUNNER_TEMP/plugin-bin" >> "$GITHUB_PATH"
      - uses: ./
        id: go
        with:
          go-version: "1.26.9"
          cache-key-prefix: remote-probe-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Assert the plugin owns the build cache
        env:
          BACKEND: ${{ steps.go.outputs.build-cache-backend }}
          KEY: ${{ steps.go.outputs.cache-primary-key }}
        run: |
          test "$BACKEND" = remote
          test "$GOCACHEPROG" = "$RUNNER_TEMP/plugin-bin/gocacheprog"
          test "$GOCACHEPROG_DIR" = "$RUNNER_TEMP/gocacheprog"
          case "$KEY" in remote-probe-*-mod-*) ;; *) echo "unexpected key $KEY"; exit 1 ;; esac
          mkdir -p "$GOMODCACHE"
          echo module > "$GOMODCACHE/remote-sentinel"
  container:
    if: github.actor == 'ashtonian' && (github.event_name != 'pull_request' || github.event.pull_request.user.login == 'ashtonian')
    runs-on: arc-go-ci-actions
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble@sha256:b0ab6f3cb99aa7803adbc14d9027ec1785fc6e433b97e134e0f8fe61683b6b53
      options: --cpus=2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: go
        with:
          go-version-file: fixtures/go.work
          workload: container
      - name: Exercise the mounted cache with cold and warm local state
        working-directory: fixtures
        env:
          BACKEND: ${{ steps.go.outputs.build-cache-backend }}
          GOCACHEPROG_LOG_LEVEL: info
        run: |
          test "$BACKEND" = remote
          test -x "$GOCACHEPROG"
          curl --fail --silent --show-error --max-time 10 "$GOCACHEPROG_REMOTE_URL/readyz" >/dev/null
          GOCACHEPROG_DIR="$RUNNER_TEMP/cache-first" go test -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/cache-first.log"
          GOCACHEPROG_DIR="$RUNNER_TEMP/cache-second" go test -count=1 ./... 2>&1 | tee "$RUNNER_TEMP/cache-second.log"
          node - "$RUNNER_TEMP/cache-first.log" "$RUNNER_TEMP/cache-second.log" <<'NODE'
          const fs = require('node:fs');
          const read = file => fs.readFileSync(file, 'utf8').split('\n').filter(l => l.startsWith('{'))
            .map(l => JSON.parse(l)).filter(v => v.msg === 'go build cache summary');
          const first = read(process.argv[2]), second = read(process.argv[3]);
          if (!first.length || !second.length) throw new Error('cache summaries are missing');
          for (const s of [...first, ...second]) {
            if (s.remote_errors || s.remote_disabled || s.uploads_disabled) throw new Error('remote cache unavailable');
          }
          if (!second.some(s => s.remote_hits > 0)) throw new Error('fresh local cache did not reuse remote objects');
          NODE
  failed:
    needs: seed
    runs-on: arc-go-ci-actions
    timeout-minutes: 15
    continue-on-error: true
    outputs:
      key: ${{ steps.go.outputs.cache-primary-key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        id: go
        with:
          go-version: "1.26.9"
          build-cache-backend: github
          cache-key-prefix: failed-probe-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Intentional failure to verify post-save suppression
        run: |
          mkdir -p "$GOCACHE"
          echo failed > "$GOCACHE/failed-only"
          exit 17
  verify:
    if: always() && !cancelled() && github.actor == 'ashtonian'
    needs: [seed, restore, disabled, failed, smoke, warm, remote, container]
    runs-on: arc-go-ci-actions
    timeout-minutes: 15
    steps:
      - env:
          SEED: ${{ needs.seed.result }}
          RESTORE: ${{ needs.restore.result }}
          DISABLED: ${{ needs.disabled.result }}
          SMOKE: ${{ needs.smoke.result }}
          WARM: ${{ needs.warm.result }}
          REMOTE: ${{ needs.remote.result }}
          CONTAINER: ${{ needs.container.result }}
          FAILED_KEY: ${{ needs.failed.outputs.key }}
          READER_KEY: ${{ needs.restore.outputs.key }}
        run: |
          test "$SEED" = success
          test "$RESTORE" = success
          test "$DISABLED" = success
          test "$SMOKE" = success
          test "$WARM" = success
          test "$REMOTE" = success
          test "$CONTAINER" = success
          test -n "$FAILED_KEY"
          test -n "$READER_KEY"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: warm
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ needs.warm.outputs.key }}
          lookup-only: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: failed
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ needs.failed.outputs.key }}
          lookup-only: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: reader
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ needs.restore.outputs.key }}
          lookup-only: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: remote-modules
        with:
          path: ${{ env.GOMODCACHE }}
          key: ${{ needs.remote.outputs.key }}
          lookup-only: true
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: remote-build
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ needs.remote.outputs.key }}
          lookup-only: true
      - env:
          FAILED_HIT: ${{ steps.failed.outputs.cache-hit }}
          READER_HIT: ${{ steps.reader.outputs.cache-hit }}
          WARM_HIT: ${{ steps.warm.outputs.cache-hit }}
          REMOTE_MODULES_HIT: ${{ steps.remote-modules.outputs.cache-hit }}
          REMOTE_BUILD_HIT: ${{ steps.remote-build.outputs.cache-hit }}
        run: |
          test "$FAILED_HIT" != true
          test "$READER_HIT" != true
          test "$WARM_HIT" = true
          test "$REMOTE_MODULES_HIT" = true
          test "$REMOTE_BUILD_HIT" != true
