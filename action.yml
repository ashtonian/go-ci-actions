name: Setup Go with workload cache
description: Install Go and maintain fresh repository-scoped module and build caches.
inputs:
  go-version:
    description: Optional Go version override.
    default: ""
  go-version-file:
    description: Go version file relative to the workspace.
    default: go.mod
  check-latest:
    description: Resolve the latest release satisfying the requested Go version.
    default: "false"
  workload:
    description: Matrix identity, build flags and external C library versions.
    default: ""
  cache-dependency-path:
    description: Dependency manifest patterns hashed into the cache key.
    default: |
      **/go.mod
      **/go.sum
      **/go.work
      **/go.work.sum
  cache-mode:
    description: "read-write, read-only, or off."
    default: read-write
  cache-key-prefix:
    description: Cache namespace; change to invalidate old cache formats.
    default: go-v1
  seed-from-other-workloads:
    description: Allow a compatible OS, architecture and compiler cache to seed a cold workload.
    default: "true"
  max-staleness-hours:
    description: Retain build objects used since setup start minus this many hours.
    default: "2"
outputs:
  go-version:
    description: Version installed by setup-go.
    value: ${{ steps.go.outputs.go-version }}
  actual-toolchain:
    description: GOVERSION resolved in this workspace.
    value: ${{ steps.identity.outputs.version }}
  cache-primary-key:
    description: Fresh key for this run and attempt.
    value: ${{ steps.identity.outputs.key }}
  cache-matched-key:
    description: Restored key or empty on a miss.
    value: ${{ steps.restore.outputs.cache-matched-key }}
  cache-hit:
    description: Exact key hit; normally false with fresh run keys.
    value: ${{ steps.restore.outputs.cache-hit || 'false' }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      id: go
      with:
        go-version: ${{ inputs.go-version }}
        go-version-file: ${{ inputs.go-version-file }}
        check-latest: ${{ inputs.check-latest }}
        cache: false
    - uses: $/_identity
      id: identity
      with:
        workflow: ${{ github.workflow }}
        job: ${{ github.job }}
        workload: ${{ inputs.workload }}
        dependency-hash: ${{ hashFiles(inputs.cache-dependency-path) }}
        os: ${{ runner.os }}
        arch: ${{ runner.arch }}
        run-id: ${{ github.run_id }}
        run-attempt: ${{ github.run_attempt }}
        cache-mode: ${{ inputs.cache-mode }}
        cache-key-prefix: ${{ inputs.cache-key-prefix }}
        seed-from-other-workloads: ${{ inputs.seed-from-other-workloads }}
        max-staleness-hours: ${{ inputs.max-staleness-hours }}
    - name: Restore Go cache
      if: inputs.cache-mode != 'off'
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.identity.outputs.build }}
          ${{ steps.identity.outputs.modules }}
        key: ${{ steps.identity.outputs.key }}
        restore-keys: ${{ steps.identity.outputs.restore-keys }}
    - name: Register successful post-save without downloading again
      if: inputs.cache-mode == 'read-write' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.identity.outputs.build }}
          ${{ steps.identity.outputs.modules }}
        key: ${{ steps.identity.outputs.key }}
        lookup-only: true
    # Reverse post ordering trims before the official cache action uploads.
    - uses: $/_lifecycle
      if: inputs.cache-mode != 'off'
      with:
        build: ${{ steps.identity.outputs.build }}
        modules: ${{ steps.identity.outputs.modules }}
        start-ms: ${{ steps.identity.outputs.start-ms }}
        max-staleness-hours: ${{ inputs.max-staleness-hours }}
        cache-mode: ${{ inputs.cache-mode }}
        matched-key: ${{ steps.restore.outputs.cache-matched-key }}
